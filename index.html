<!-- ═══ 화면 불러오기 ═══
     content.js의 screens 목록에 적힌 화면만 screens/ 폴더에서 읽어와 붙입니다.
     한 화면을 못 읽어와도 나머지 화면은 그대로 살아 있습니다.
     화면이 다 붙은 뒤에 app.js를 싣습니다.                        -->
<script>
/* content.js에 오타가 나면 화면이 하얗게 뜹니다.
   무엇이 어디서 잘못됐는지 화면에 그대로 보여 주려고 오류를 잡아 둡니다. */
window.__contentError = null;
window.addEventListener('error', function(e){
  if(e.filename && e.filename.indexOf('content.js') > -1 && !window.__contentError){
    window.__contentError = { msg: e.message, line: e.lineno };
  }
}, true);
</script>
<script src="content.js"></script>
<script>
/* content.js를 못 읽었을 때 — 하얀 화면 대신 고칠 곳을 알려 준다 */
(function(){
  if(typeof CONTENT !== 'undefined' && CONTENT && CONTENT.screens) return;
  var e = window.__contentError || {};
  var line = e.line ? ('<b>' + e.line + '번째 줄</b> 언저리') : '어느 줄인지 알 수 없는 곳';
  document.body.innerHTML =
    '<div style="max-width:430px;margin:0 auto;padding:56px 24px;' +
    'font:400 15px/1.7 system-ui,-apple-system,sans-serif;color:#1D1D1F;">' +
    '<div style="font-size:34px;margin-bottom:18px;">🩹</div>' +
    '<h1 style="font-size:22px;font-weight:600;margin:0 0 14px;">content.js를 읽지 못했습니다</h1>' +
    '<p style="color:#6E6E73;margin:0 0 22px;">앱이 아니라 <b>글자 하나</b>가 문제인 경우가 거의 전부입니다. ' +
    'content.js의 ' + line + '를 살펴보세요.</p>' +
    '<div style="background:#F5F5F7;border-radius:12px;padding:16px 18px;margin-bottom:22px;">' +
    '<div style="font-weight:600;margin-bottom:10px;">자주 나는 실수</div>' +
    '<ul style="margin:0;padding-left:18px;color:#3A3A3C;">' +
    '<li>줄 끝의 <b>쉼표</b>를 빠뜨렸다</li>' +
    '<li><b>따옴표</b>를 한쪽만 닫았다</li>' +
    '<li>중괄호 <b>}</b> 나 대괄호 <b>]</b> 를 지웠다</li>' +
    '</ul></div>' +
    (e.msg ? '<div style="background:#FFF4F4;border-radius:12px;padding:14px 16px;margin-bottom:22px;">' +
             '<div style="font-weight:600;margin-bottom:6px;font-size:13px;">브라우저가 알려 준 말</div>' +
             '<code style="font-size:12px;color:#B3261E;word-break:break-all;">' +
             String(e.msg).replace(/[<>&]/g, '') + '</code></div>' : '') +
    '<p style="color:#6E6E73;font-size:13px;margin:0;">고친 뒤 새로 고치면 됩니다. ' +
    '되돌리고 싶으면 GitHub에서 content.js의 <b>History</b>로 이전 상태를 볼 수 있습니다.</p>' +
    '</div>';
})();
</script>
<script>
(function(){
  var app  = document.getElementById('app');
  if(!app) return;
  var list = (typeof CONTENT !== 'undefined' && CONTENT && CONTENT.screens) || [];
  if(!list.length) return;

  /* 목록 순서를 지키려고 자리를 먼저 잡아 둔다 */
  var slots = list.map(function(name){
    var slot = document.createElement('div');
    slot.setAttribute('data-screen', name);
    app.appendChild(slot);
    return slot;
  });

  function load(name, slot){
    return fetch('screens/' + name + '.html')
      .then(function(r){
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        return r.text();
      })
      .then(function(html){
        slot.outerHTML = html;
      })
      .catch(function(err){
        /* 한 화면이 실패해도 여기서 멈춘다 — 나머지는 계속 뜬다 */
        console.warn('[screens] ' + name + ' 화면을 불러오지 못했습니다:', err.message);
        slot.parentNode && slot.parentNode.removeChild(slot);
      });
  }

  Promise.all(list.map(function(name, i){ return load(name, slots[i]); }))
    .then(function(){
      var s = document.createElement('script');
      s.src = 'app.js';
      document.body.appendChild(s);
    });
})();
</script>
